<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Mis cuentas — Thalamus</title>
<style>
  :root{
    --bg:#000; --card:#0e0e11; --border:#26262b; --text:#eef0f3; --muted:#8a8f9c;
    --accent:#33D6A6;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;}
  .wrap{max-width:560px;margin:0 auto;padding:32px 16px 80px;}
  h1{font-size:26px;margin:0 0 4px;font-family:'Space Grotesk',Inter,sans-serif;letter-spacing:-.02em;}
  .sub{color:var(--muted);font-size:14px;margin:0 0 24px;line-height:1.4;}
  .card{position:relative;background:var(--card);border:1px solid var(--border);border-radius:16px;
        padding:16px 16px 16px 20px;margin-bottom:12px;display:flex;gap:16px;flex-wrap:wrap;}
  .accent-bar{position:absolute;left:0;top:0;bottom:0;width:4px;border-radius:16px 0 0 16px;}
  .info{flex:1;min-width:180px;}
  .bank-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-weight:600;}
  .bank-row .alias{color:var(--muted);font-weight:400;font-size:13px;}
  .field-row{display:flex;align-items:center;gap:6px;margin-bottom:6px;font-size:14px;}
  .field-label{width:64px;flex-shrink:0;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:#5c6270;}
  .field-value{font-family:'JetBrains Mono',monospace;color:#d4d7dd;}
  .icon-btn{background:none;border:none;color:var(--muted);cursor:pointer;padding:4px;border-radius:6px;display:inline-flex;}
  .icon-btn:hover{color:var(--accent);background:rgba(51,214,166,.1);}
  .actions{display:flex;gap:14px;margin-top:10px;font-size:12px;}
  .actions button{background:none;border:none;color:var(--muted);cursor:pointer;display:flex;align-items:center;gap:4px;font-size:12px;padding:0;}
  .actions button:hover{color:var(--text);}
  .actions button.danger:hover{color:#f26d6d;}
  .qr-wrap{flex-shrink:0;width:128px;height:128px;border-radius:12px;overflow:hidden;background:#fff;
           display:flex;align-items:center;justify-content:center;cursor:pointer;border:1px solid var(--border);margin:0 auto;}
  .qr-wrap img{width:100%;height:100%;object-fit:contain;padding:8px;}
  .qr-empty{width:128px;height:128px;border-radius:12px;border:1px dashed var(--border);
            display:flex;align-items:center;justify-content:center;color:#444;margin:0 auto;}
  .add-btn{width:100%;padding:14px;border-radius:12px;border:1px solid var(--border);background:var(--card);
           color:var(--muted);cursor:pointer;font-size:14px;font-weight:500;margin-top:6px;}
  .add-btn:hover{color:var(--accent);border-color:rgba(51,214,166,.4);}
  .form{background:#050505;border:1px solid var(--border);border-radius:16px;padding:20px;margin-bottom:12px;}
  .form label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:#5c6270;margin-bottom:4px;}
  .form input[type=text]{width:100%;background:#111;border:1px solid var(--border);border-radius:8px;
            padding:9px 10px;color:var(--text);font-size:14px;margin-bottom:14px;outline:none;}
  .form input[type=text]:focus{border-color:rgba(51,214,166,.5);}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .drop{border:1px dashed var(--border);border-radius:10px;padding:24px;text-align:center;color:var(--muted);
        cursor:pointer;font-size:13px;margin-bottom:14px;}
  .drop:hover{border-color:rgba(51,214,166,.4);color:var(--accent);}
  .form-actions{display:flex;justify-content:flex-end;gap:8px;}
  .btn-secondary{background:none;border:none;color:var(--muted);padding:8px 12px;cursor:pointer;font-size:14px;}
  .btn-primary{background:var(--accent);border:none;color:#000;padding:8px 16px;border-radius:8px;
               font-weight:600;font-size:14px;cursor:pointer;}
  .btn-primary:disabled{opacity:.4;cursor:not-allowed;}
  .empty{text-align:center;padding:56px 20px;border:1px dashed var(--border);border-radius:16px;color:#5c6270;}
  .footer-note{text-align:center;font-size:11px;color:#444;margin-top:32px;}
  .lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);display:flex;flex-direction:column;
            align-items:center;justify-content:center;z-index:50;padding:24px;}
  .lightbox img{max-width:100%;max-height:70vh;border-radius:12px;background:#fff;padding:12px;}
  .lightbox .close{position:absolute;top:16px;right:16px;background:#111;border:1px solid var(--border);
                    border-radius:999px;padding:8px;color:#ccc;cursor:pointer;}
  .lightbox .dl{margin-top:20px;background:var(--accent);color:#000;border:none;padding:10px 18px;
                border-radius:8px;font-weight:600;cursor:pointer;}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#161616;border:1px solid var(--border);
         padding:8px 14px;border-radius:8px;font-size:13px;color:#ccc;}
  .masked{letter-spacing:2px;}
</style>
</head>
<body>
<div class="wrap" id="app">
  <h1>Mis cuentas</h1>
  <p class="sub">Guardado en tu Worker de Thalamus — accesible desde cualquier dispositivo con este link, sin necesidad de cuenta.</p>
  <div id="list"></div>
  <button class="add-btn" id="addBtn">+ Agregar cuenta</button>
  <p class="footer-note">Los datos son visibles para cualquiera que tenga este link. No lo compartas si contiene información sensible.</p>
</div>

<script>
const API = '/api/cuentas';
let accounts = [];
let editingId = null; // null = not editing, 'new' = new form, or account id
let pendingImage = null;

const ACCENTS = ['#33D6A6','#F2A93B','#6E9BFF','#F26D6D','#C084F5','#4CD1E0'];
function accentFor(name){
  const s=(name||'').trim().toLowerCase(); if(!s) return ACCENTS[0];
  let h=0; for(let i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))>>>0;
  return ACCENTS[h%ACCENTS.length];
}
function maskNumber(num){
  if(!num) return '';
  const d=num.replace(/\s/g,''); if(d.length<=4) return d;
  return '•••• '+d.slice(-4);
}
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

async function load(){
  try{
    const res = await fetch(API);
    const data = await res.json();
    accounts = data.accounts || [];
  }catch(e){ accounts = []; }
  render();
}

async function persist(){
  await fetch(API, {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ accounts })
  });
}

function toast(msg){
  const t=document.createElement('div'); t.className='toast'; t.textContent=msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(),1400);
}

function render(){
  const list = document.getElementById('list');
  if(editingId === 'new'){
    list.innerHTML = renderForm(null) + accounts.map(renderCard).join('');
  } else {
    if(accounts.length===0){
      list.innerHTML = '<div class="empty">Todavía no agregaste ninguna cuenta.<br/><span style="font-size:12px">Agrega la primera con el botón de abajo.</span></div>';
    } else {
      list.innerHTML = accounts.map(a => editingId===a.id ? renderForm(a) : renderCard(a)).join('');
    }
  }
  attachHandlers();
}

function renderCard(a){
  const accent = accentFor(a.bank);
  const revealed = a._revealed;
  const acc = a.accountNumber ? (revealed ? a.accountNumber : maskNumber(a.accountNumber)) : '—';
  const cci = a.cci ? (revealed ? a.cci : maskNumber(a.cci)) : '—';
  return `
  <div class="card" data-id="${a.id}">
    <div class="accent-bar" style="background:${accent}"></div>
    <div class="info">
      <div class="bank-row">🏛️ ${escapeHtml(a.bank)} ${a.alias? `<span class="alias">· ${escapeHtml(a.alias)}</span>`:''}</div>
      <div class="field-row"><span class="field-label">Cuenta</span><span class="field-value">${escapeHtml(acc)}</span>
        ${a.accountNumber?`<button class="icon-btn copy-btn" data-copy="${escapeHtml(a.accountNumber)}" title="Copiar">📋</button>`:''}
      </div>
      <div class="field-row"><span class="field-label">CCI</span><span class="field-value">${escapeHtml(cci)}</span>
        ${a.cci?`<button class="icon-btn copy-btn" data-copy="${escapeHtml(a.cci)}" title="Copiar">📋</button>`:''}
      </div>
      <div class="actions">
        <button class="reveal-btn" data-id="${a.id}">${revealed?'🙈 Ocultar':'👁 Mostrar'}</button>
        <button class="edit-btn" data-id="${a.id}">✏️ Editar</button>
        <button class="danger del-btn" data-id="${a.id}">🗑 Eliminar</button>
      </div>
    </div>
    ${a.image
      ? `<div class="qr-wrap open-lightbox" data-id="${a.id}"><img src="${a.image}" alt="QR"/></div>`
      : `<div class="qr-empty">QR</div>`}
  </div>`;
}

function renderForm(a){
  const id = a? a.id : 'new';
  const image = a? a.image : pendingImage;
  return `
  <div class="form" data-form-id="${id}">
    <div class="grid2">
      <div><label>Banco</label><input type="text" class="f-bank" placeholder="Interbank" value="${a?escapeHtml(a.bank):''}"/></div>
      <div><label>Alias (opcional)</label><input type="text" class="f-alias" placeholder="Cuenta sueldo" value="${a?escapeHtml(a.alias||''):''}"/></div>
    </div>
    <label>Número de cuenta</label>
    <input type="text" class="f-account" placeholder="191-xxxxxxxx-x-xx" value="${a?escapeHtml(a.accountNumber||''):''}"/>
    <label>CCI</label>
    <input type="text" class="f-cci" placeholder="003-191-xxxxxxxxxxxx-xx" value="${a?escapeHtml(a.cci||''):''}"/>
    <label>Imagen / QR</label>
    ${image
      ? `<div style="margin-bottom:14px;"><img src="${image}" style="height:130px;border-radius:8px;border:1px solid var(--border);background:#fff;padding:6px;" class="preview-img"/>
         <button class="btn-secondary remove-img-btn">Quitar imagen</button></div>`
      : `<div class="drop file-trigger">📷 Subir imagen del QR o captura</div>
         <input type="file" accept="image/*" class="file-input" style="display:none"/>`}
    <div class="form-actions">
      <button class="btn-secondary cancel-form-btn">Cancelar</button>
      <button class="btn-primary save-form-btn">Guardar</button>
    </div>
  </div>`;
}

function attachHandlers(){
  document.getElementById('list').querySelectorAll('.copy-btn').forEach(btn=>{
    btn.onclick = ()=>{ navigator.clipboard.writeText(btn.dataset.copy); toast('Copiado'); };
  });
  document.getElementById('list').querySelectorAll('.reveal-btn').forEach(btn=>{
    btn.onclick = ()=>{
      const acc = accounts.find(a=>a.id===btn.dataset.id);
      acc._revealed = !acc._revealed; render();
    };
  });
  document.getElementById('list').querySelectorAll('.edit-btn').forEach(btn=>{
    btn.onclick = ()=>{ editingId = btn.dataset.id; pendingImage=null; render(); };
  });
  document.getElementById('list').querySelectorAll('.del-btn').forEach(btn=>{
    btn.onclick = async ()=>{
      accounts = accounts.filter(a=>a.id!==btn.dataset.id);
      render(); await persist();
    };
  });
  document.getElementById('list').querySelectorAll('.open-lightbox').forEach(el=>{
    el.onclick = ()=>{
      const acc = accounts.find(a=>a.id===el.dataset.id);
      openLightbox(acc.image, acc.bank);
    };
  });
  document.getElementById('list').querySelectorAll('.cancel-form-btn').forEach(btn=>{
    btn.onclick = ()=>{ editingId=null; pendingImage=null; render(); };
  });
  document.getElementById('list').querySelectorAll('.remove-img-btn').forEach(btn=>{
    btn.onclick = ()=>{ pendingImage=null; const form=btn.closest('.form'); const acc=accounts.find(a=>a.id===form.dataset.formId); if(acc) acc.image=null; render(); };
  });
  document.getElementById('list').querySelectorAll('.file-trigger').forEach(el=>{
    el.onclick = ()=>{ el.nextElementSibling.click(); };
  });
  document.getElementById('list').querySelectorAll('.file-input').forEach(input=>{
    input.onchange = async ()=>{
      const file = input.files[0]; if(!file) return;
      if(!file.type.startsWith('image/')){ toast('Eso no es una imagen'); return; }
      if(file.size > 4.5*1024*1024){ toast('Imagen muy pesada (máx ~4.5MB)'); return; }
      const reader = new FileReader();
      reader.onload = () => { pendingImage = reader.result; render(); };
      reader.readAsDataURL(file);
    };
  });
  document.getElementById('list').querySelectorAll('.save-form-btn').forEach(btn=>{
    btn.onclick = async ()=>{
      const form = btn.closest('.form');
      const id = form.dataset.formId;
      const bank = form.querySelector('.f-bank').value.trim();
      if(!bank){ toast('Falta el nombre del banco'); return; }
      const alias = form.querySelector('.f-alias').value.trim();
      const accountNumber = form.querySelector('.f-account').value.trim();
      const cci = form.querySelector('.f-cci').value.trim();
      let image = pendingImage;
      if(image===null && id!=='new'){
        const existing = accounts.find(a=>a.id===id);
        image = existing ? existing.image : null;
      }
      if(id==='new'){
        accounts.unshift({ id: uid(), bank, alias, accountNumber, cci, image, updatedAt: Date.now() });
      } else {
        const acc = accounts.find(a=>a.id===id);
        Object.assign(acc, { bank, alias, accountNumber, cci, image, updatedAt: Date.now() });
      }
      editingId = null; pendingImage = null;
      render();
      await persist();
    };
  });
}

function openLightbox(src, bank){
  const box = document.createElement('div');
  box.className='lightbox';
  box.innerHTML = `
    <button class="close">✕</button>
    <img src="${src}"/>
    <button class="dl">⬇ Descargar imagen</button>
  `;
  box.onclick = (e)=>{ if(e.target===box) box.remove(); };
  box.querySelector('.close').onclick = ()=>box.remove();
  box.querySelector('.dl').onclick = (e)=>{
    e.stopPropagation();
    const a=document.createElement('a'); a.href=src; a.download=(bank||'cuenta')+'-qr.png';
    document.body.appendChild(a); a.click(); a.remove();
  };
  document.body.appendChild(box);
}

document.getElementById('addBtn').onclick = ()=>{ editingId='new'; pendingImage=null; render(); };

load();
</script>
</body>
</html>
