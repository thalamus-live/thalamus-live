<!DOCTYPE html>
<html lang="es">
<head>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
<meta name="theme-color" content="#6BBF9E"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="apple-mobile-web-app-title" content="Atlas Finanzas"/>
<title>Atlas Finanzas</title>
<link rel="manifest" href="manifest.json"/>
<style>
:root{--bg:#f0f4f1;--panel:#fff;--card:#fff;--muted:#e8f0eb;--border:#d0ddd4;--borderHi:#b0c8b8;--green:#6BBF9E;--greenDk:#4a9d7e;--greenBg:#e8f5ef;--red:#e05c6e;--redBg:#fdeef0;--amber:#d4860a;--amberBg:#fff3e0;--text:#1a2e22;--sub:#4a6355;--mutedTx:#7a9a87;--mono:'Courier New',Consolas,monospace}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Inter','Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px;min-height:100vh;padding-bottom:env(safe-area-inset-bottom)}
.hdr{background:var(--green);display:flex;align-items:stretch;justify-content:space-between;padding:0 16px}
.tab{background:none;border:none;color:rgba(255,255,255,0.8);font-size:12px;font-weight:700;letter-spacing:.5px;padding:14px 16px;cursor:pointer;border-bottom:3px solid transparent;transition:all .15s}
.tab.active{color:#fff;border-bottom-color:#fff;background:rgba(255,255,255,0.15)}
.hdr-right{display:flex;align-items:center;gap:10px}
.hdr-clock{font-family:var(--mono);font-size:11px;color:rgba(255,255,255,0.75)}
.sync-dot{width:7px;height:7px;border-radius:50%;background:#fff;opacity:0.4;transition:all .3s;flex-shrink:0}
.sync-dot.synced{background:#fff;opacity:1;box-shadow:0 0 6px #fff}
.sync-dot.syncing{background:#ffd600;opacity:1;animation:pulse 1s ease-in-out infinite}
.sync-dot.error{background:#ff4d6a;opacity:1}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}
.titlebar{background:#fff;border-bottom:1px solid var(--border);padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
.titlebar-main{font-size:18px;font-weight:900;color:var(--text)}
.titlebar-sub{font-size:9px;letter-spacing:3px;color:var(--mutedTx);font-weight:700;text-transform:uppercase}
.strip{background:#fff;border-bottom:1px solid var(--border);display:flex;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.strip-item{display:flex;flex-direction:column;gap:3px;padding:10px 18px;border-right:1px solid var(--border);flex-shrink:0}
.strip-label{font-size:8px;letter-spacing:2px;color:var(--mutedTx);font-weight:700;text-transform:uppercase}
.strip-val{font-family:var(--mono);font-size:16px;font-weight:800}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;padding:14px 12px}
@media(min-width:480px){.grid{grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;padding:16px 20px}}
.tile.dragging{opacity:0.4;transform:scale(0.97);}
.tile.drag-over{border:2px dashed var(--green)!important;background:var(--greenBg)!important;}
.tile{background:#fff;border:1px solid var(--border);border-radius:12px;padding:14px;cursor:pointer;position:relative;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.05);transition:box-shadow .15s}
.tile:active{box-shadow:0 0 0 2px var(--green)}
.bar-track{height:4px;background:#dde8e1;border-radius:99px;overflow:hidden;margin:10px 0 0}
.bar-fill{height:100%;border-radius:99px;transition:width .5s ease}
.detail{padding:12px 14px}
@media(min-width:480px){.detail{padding:16px 20px}}
.detail-hero{background:#fff;border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.chip{border-radius:10px;padding:10px 12px;border:1px solid var(--border)}
.chip-label{font-size:8px;letter-spacing:2px;color:var(--mutedTx);font-weight:700;margin-bottom:4px;text-transform:uppercase}
.chip-val{font-family:var(--mono);font-size:13px;font-weight:800}
.edit-grid{background:#fff;border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:14px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field-label{font-size:9px;letter-spacing:1px;color:var(--mutedTx);font-weight:700;margin-bottom:5px;text-transform:uppercase}
input,select{background:#fff;border:1px solid var(--border);border-radius:7px;color:var(--text);padding:9px 10px;font-size:13px;outline:none;width:100%;font-family:inherit;-webkit-appearance:none}
input:focus,select:focus{border-color:var(--green);box-shadow:0 0 0 2px var(--greenBg)}
.mov-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.mov-sect{font-size:10px;letter-spacing:2px;color:var(--mutedTx);font-weight:700;text-transform:uppercase}
.mov-form{background:#fff;border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:12px;display:flex;flex-direction:column;gap:10px}
.mov-row{display:flex;gap:10px}
.mov-list{background:#fff;border-radius:12px;border:1px solid var(--border);overflow:hidden}
.mov-item{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--border)}
.mov-item:last-child{border-bottom:none}
.mov-desc{font-size:13px;font-weight:600;color:var(--text);margin-bottom:2px}
.mov-meta{font-size:11px;color:var(--mutedTx)}
.mov-amt{font-family:var(--mono);font-size:14px;font-weight:800;flex-shrink:0}
.empty{font-size:12px;color:var(--mutedTx);padding:24px 0;border-top:1px solid var(--border);text-align:center}
.btn-outline{background:#fff;border:1.5px solid var(--green);color:var(--green);padding:7px 14px;border-radius:7px;cursor:pointer;font-size:12px;font-weight:700;font-family:inherit;white-space:nowrap}
.btn-outline.sm{padding:6px 12px;font-size:11px}
.btn-outline.gray{border-color:var(--border);color:var(--sub)}
.btn-solid{border:none;color:#fff;padding:10px 18px;border-radius:7px;cursor:pointer;font-size:13px;font-weight:800;font-family:inherit}
.btn-back{background:var(--muted);border:1px solid var(--border);color:var(--sub);padding:7px 14px;border-radius:7px;cursor:pointer;font-size:12px;font-weight:700}
.modal-overlay{position:fixed;inset:0;background:rgba(10,30,15,.5);z-index:100;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:480px){.modal-overlay{align-items:center;padding:16px}}
.modal{background:#fff;border-radius:20px 20px 0 0;width:100%;max-width:480px;padding:20px 16px calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px;max-height:90vh;overflow-y:auto}
@media(min-width:480px){.modal{border-radius:16px;padding:24px}}
.modal-handle{width:36px;height:4px;background:var(--border);border-radius:99px;margin:0 auto -6px}
.modal-title{font-size:17px;font-weight:900;color:var(--green)}
.upload-zone{border:2px dashed var(--border);border-radius:12px;padding:28px 16px;text-align:center;cursor:pointer;background:#fafcfb;transition:all .2s}
.upload-zone.has-img{border-color:var(--green);background:var(--greenBg)}
.scan-result{background:var(--greenBg);border:1px solid #b0ddc8;border-radius:12px;padding:14px}
.result-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.scan-err{background:var(--redBg);border:1px solid #f5c0c8;border-radius:8px;padding:10px 14px;font-size:12px;color:var(--red);font-weight:600}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--text);color:#fff;padding:10px 20px;border-radius:99px;font-size:13px;font-weight:600;z-index:200;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{display:inline-block;animation:spin 1s linear infinite}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast"></div>

<script>
// ── STORAGE KEY ─────────────────────────────────────────────────────────
const LS_KEY = 'atlas_finanzas_v2';
// ── JSONBIN CONFIG ──────────────────────────────────────────────────────
// Usamos jsonbin.io como backend gratuito — sin servidor requerido
// Se crea automáticamente en el primer guardado
const JSONBIN_URL = 'https://api.jsonbin.io/v3/b';
const JSONBIN_KEY = '$2a$10$AtlasFinanzasPublicKeyXXXXXXXXXXXXXX'; // se sobreescribe con el real
let BIN_ID = localStorage.getItem('atlas_bin_id') || null;

const DEFAULT_CARDS=[
  {id:'ib1',bank:'INTERBANK',name:'Personal 1',tag:'IB·01',bankColor:'#00a651',deuda:0,linea:0,corte:'',pago:'',movimientos:[],tipo:'credito'},
  {id:'ib2',bank:'INTERBANK',name:'Personal 2',tag:'IB·02',bankColor:'#00a651',deuda:0,linea:0,corte:'',pago:'',movimientos:[],tipo:'credito'},
  {id:'ib3',bank:'INTERBANK',name:'Personal 3',tag:'IB·03',bankColor:'#00a651',deuda:0,linea:0,corte:'',pago:'',movimientos:[],tipo:'credito'},
  {id:'ibp',bank:'INTERBANK',name:'Platinum',tag:'IB·PT',bankColor:'#b8960a',deuda:0,linea:0,corte:'',pago:'',movimientos:[],tipo:'credito'},
  {id:'cmr',bank:'FALABELLA',name:'CMR',tag:'CMR',bankColor:'#7B2D8B',deuda:0,linea:0,corte:'',pago:'',movimientos:[],tipo:'credito'},
  {id:'bbva',bank:'BBVA',name:'Continental',tag:'BBVA',bankColor:'#004A98',deuda:0,linea:0,corte:'',pago:'',movimientos:[],tipo:'credito'},
];
const CATS=['Alimentación','Transporte','Entretenimiento','Salud','Educación','Servicios','Ropa','Viajes','Otros'];

const fmt=(n,moneda)=>{
  const sym = moneda==='USD'?'$ ':'S/ ';
  return sym+Number(n).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,',');
};
const fmtC=(n,card)=>fmt(n,card?.moneda);
const pct=(d,l)=>l>0?Math.min(100,(d/l)*100):0;
const heat=p=>p<50?'#6BBF9E':p<80?'#d4860a':'#e05c6e';
const heatBg=p=>p<50?'#e8f5ef':p<80?'#fff3e0':'#fdeef0';
const today=()=>new Date().toISOString().slice(0,10);

// ── LOAD FROM LOCALSTORAGE ──────────────────────────────────────────────
function loadLocal(){
  try{const d=localStorage.getItem(LS_KEY);return d?JSON.parse(d):DEFAULT_CARDS.map(c=>({...c}));}
  catch(e){return DEFAULT_CARDS.map(c=>({...c}));}
}
function saveLocal(cards){
  try{localStorage.setItem(LS_KEY,JSON.stringify(cards));}catch(e){}
}

let state={
  cards:loadLocal(),
  view:'dashboard',selId:null,editMode:false,editData:{},
  addingMov:false,newMov:{fecha:today(),desc:'',monto:'',cat:'Otros',tipo:'gasto'},
  showScan:false,
  scan:{targetId:null,imgB64:null,imgType:'image/jpeg',preview:null,scanning:false,result:null,error:null,scanMode:'estado'},resumenMes:null,quickModal:null,
  syncStatus:'idle', // idle | syncing | synced | error
};

// ── SYNC STATUS DOT ─────────────────────────────────────────────────────
function setSyncStatus(s){
  state.syncStatus=s;
  const dot=document.getElementById('sync-dot');
  if(!dot)return;
  dot.className='sync-dot '+s;
  dot.title=s==='synced'?'Datos guardados en la nube':s==='syncing'?'Sincronizando...':s==='error'?'Sin conexión — guardado localmente':'';
}

// ── CLOUD SAVE via JSONBin ───────────────────────────────────────────────
// Plan gratuito: 10,000 req/mes, 1MB por bin — más que suficiente
let saveTimer=null;
function scheduleSave(cards){
  saveLocal(cards);
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>cloudSave(cards),1200);
}

async function cloudSave(cards){
  setSyncStatus('syncing');
  try{
    const payload={cards,updated:new Date().toISOString()};
    if(BIN_ID){
      // actualizar bin existente
      const r=await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`,{
        method:'PUT',
        headers:{'Content-Type':'application/json','X-Master-Key':'$2a$10$vRmS7ZQjMxNfPxu9kLzXouYuDrWX5E6fKsPJCLvMQqQGhPqrDRFXK'},
        body:JSON.stringify(payload)
      });
      if(r.ok){setSyncStatus('synced');showToast('☁ Guardado en la nube');return;}
    }
    // crear nuevo bin
    const r=await fetch('https://api.jsonbin.io/v3/b',{
      method:'POST',
      headers:{'Content-Type':'application/json','X-Master-Key':'$2a$10$vRmS7ZQjMxNfPxu9kLzXouYuDrWX5E6fKsPJCLvMQqQGhPqrDRFXK','X-Bin-Name':'atlas-finanzas','X-Bin-Private':'true'},
      body:JSON.stringify(payload)
    });
    if(r.ok){
      const d=await r.json();
      BIN_ID=d.metadata?.id||d.record?.id||null;
      if(BIN_ID)localStorage.setItem('atlas_bin_id',BIN_ID);
      setSyncStatus('synced');showToast('☁ Guardado en la nube');
    }else{setSyncStatus('error');}
  }catch(e){setSyncStatus('error');}
}

// ── TOAST ────────────────────────────────────────────────────────────────
function showToast(msg){
  const t=document.getElementById('toast');
  if(!t)return;
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2200);
}

// ── RENDER ─────────────────────────────────────────────────────────────
function render(){
  document.getElementById('app').innerHTML=buildApp();
  bindEvents();startClock();
  initDragDrop();
}

function buildApp(){
  const{cards,view,selId,showScan,syncStatus}=state;
  const card=cards.find(c=>c.id===selId);
  const td=cards.reduce((s,c)=>s+c.deuda,0),tl=cards.reduce((s,c)=>s+c.linea,0),ug=pct(td,tl);
  return `
    ${showScan?buildScanModal():''}${state.quickModal?buildQuickModal():''}
    <div class="hdr">
      <div style="display:flex">
        <button class="tab ${view==='dashboard'?'active':''}" data-action="goto-dashboard">MIS TARJETAS</button>
        <button class="tab ${view==='resumen'?'active':''}" data-action="goto-resumen">📊 RESUMEN</button>
        <button class="tab" data-action="open-scan">📷 SCAN</button>
      </div>
      <div class="hdr-right">
        <div id="sync-dot" class="sync-dot ${syncStatus}" title="Estado de sincronización"></div>
        <div class="hdr-clock"><span id="clock"></span></div>
      </div>
    </div>
    <div class="titlebar">
      <div>
        <div class="titlebar-sub">ATLAS FINANZAS · ATLAS</div>
        <div class="titlebar-main">${view==='card'&&card?card.name:'Dashboard'}</div>
      </div>
      ${view==='card'?'<button class="btn-back" data-action="goto-dashboard">← Volver</button>':''}
    </div>
    <div class="strip">
      <div class="strip-item"><span class="strip-label">DEUDA TOTAL</span><span class="strip-val" style="color:#e05c6e">${fmt(td)}</span></div>
      <div class="strip-item"><span class="strip-label">LÍNEA TOTAL</span><span class="strip-val">${fmt(tl)}</span></div>
      <div class="strip-item"><span class="strip-label">DISPONIBLE</span><span class="strip-val" style="color:#6BBF9E">${fmt(Math.max(0,tl-td))}</span></div>
      <div class="strip-item"><span class="strip-label">USO GLOBAL</span><span class="strip-val" style="color:${heat(ug)}">${ug.toFixed(1)}%</span></div>
    </div>
    ${view==='dashboard'?buildDashboard():''}
    ${view==='resumen'?buildResumen():''}
    ${view==='card'&&card?buildDetail(card):''}
  `;
}



function exportarCSV(){
  const selMes = state.resumenMes || new Date().toISOString().slice(0,7);
  const allMovs = state.cards.flatMap(card =>
    (card.movimientos||[])
      .filter(m => m.fecha && m.fecha.startsWith(selMes))
      .map(m => ({
        Fecha: m.fecha,
        Descripcion: m.desc,
        Categoria: m.cat||'Otros',
        Tipo: m.tipo==='gasto'?'Egreso':'Ingreso',
        Monto: m.monto.toFixed(2),
        Moneda: card.moneda||'PEN',
        Tarjeta: card.name,
        Banco: card.bank,
      }))
  );
  if(!allMovs.length){ showToast('Sin movimientos para exportar'); return; }
  const headers = Object.keys(allMovs[0]);
  const rows = allMovs.map(r => headers.map(h => `"${String(r[h]).replace(/"/g,'""')}"`).join(','));
  const csv = [headers.join(','), ...rows].join('\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `atlas-finanzas-${selMes}.csv`;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
  showToast('✓ CSV exportado');
}

function buildResumen(){
  const now = new Date();
  const months = [];
  // Generar últimos 6 meses
  for(let i=0;i<6;i++){
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    months.push({
      key: `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`,
      label: d.toLocaleDateString('es-PE',{month:'long',year:'numeric'}),
      year: d.getFullYear(),
      month: d.getMonth()+1,
    });
  }

  // Recopilar todos los movimientos de todas las tarjetas
  const allMovs = state.cards.flatMap(c =>
    (c.movimientos||[]).map(m => ({...m, cardName: c.name, cardBank: c.bank, cardColor: c.bankColor}))
  );

  // Agrupar por mes
  const byMonth = {};
  allMovs.forEach(m => {
    const key = m.fecha ? m.fecha.slice(0,7) : null;
    if(!key) return;
    if(!byMonth[key]) byMonth[key] = {gastos:[], pagos:[]};
    if(m.tipo==='gasto') byMonth[key].gastos.push(m);
    else byMonth[key].pagos.push(m);
  });

  const selMes = state.resumenMes || months[0].key;
  const data = byMonth[selMes] || {gastos:[], pagos:[]};
  const totalGastos = data.gastos.reduce((s,m)=>s+m.monto,0);
  const totalPagos  = data.pagos.reduce((s,m)=>s+m.monto,0);
  const balance = totalPagos - totalGastos;

  // Gastos por categoría
  const byCat = {};
  data.gastos.forEach(m => {
    byCat[m.cat||'Otros'] = (byCat[m.cat||'Otros']||0) + m.monto;
  });
  const cats = Object.entries(byCat).sort((a,b)=>b[1]-a[1]);

  const catColors = {
    'Alimentación':'#e05c6e','Transporte':'#3a7abf','Entretenimiento':'#9b59b6',
    'Salud':'#e67e22','Educación':'#27ae60','Servicios':'#f39c12',
    'Ropa':'#e91e63','Viajes':'#00bcd4','Otros':'#7a9a87'
  };

  return `<div style="padding:14px 12px">
    <!-- Botón exportar -->
    <div style="display:flex;justify-content:flex-end;margin-bottom:8px">
      <button data-action="exportar-csv" style="background:var(--greenBg);border:1.5px solid var(--green);color:var(--greenDk);padding:8px 14px;border-radius:8px;cursor:pointer;font-size:12px;font-weight:700;font-family:inherit">
        📤 Exportar CSV
      </button>
    </div>

    <!-- Selector de mes -->
    <div style="background:#fff;border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:12px">
      <div style="font-size:9px;letter-spacing:2px;color:var(--mutedTx);font-weight:700;margin-bottom:8px;text-transform:uppercase">Período</div>
      <select onchange="state.resumenMes=this.value;render()" style="background:#fff;border:1px solid var(--border);border-radius:7px;color:var(--text);padding:9px 10px;font-size:13px;width:100%;font-family:inherit;-webkit-appearance:none">
        ${months.map(m=>`<option value="${m.key}" ${selMes===m.key?'selected':''}>${m.label.charAt(0).toUpperCase()+m.label.slice(1)}</option>`).join('')}
      </select>
    </div>

    <!-- Cards resumen -->
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px">
      <div style="background:#fdeef0;border:1px solid #f5c0c8;border-radius:12px;padding:14px">
        <div style="font-size:9px;letter-spacing:2px;color:#e05c6e;font-weight:700;margin-bottom:6px">EGRESOS</div>
        <div style="font-family:var(--mono);font-size:16px;font-weight:800;color:#e05c6e">${fmt(totalGastos)}</div>
        <div style="font-size:11px;color:var(--mutedTx);margin-top:3px">${data.gastos.length} movimientos</div>
      </div>
      <div style="background:#e8f5ef;border:1px solid #b0ddc8;border-radius:12px;padding:14px">
        <div style="font-size:9px;letter-spacing:2px;color:var(--greenDk);font-weight:700;margin-bottom:6px">INGRESOS/PAGOS</div>
        <div style="font-family:var(--mono);font-size:16px;font-weight:800;color:var(--greenDk)">${fmt(totalPagos)}</div>
        <div style="font-size:11px;color:var(--mutedTx);margin-top:3px">${data.pagos.length} movimientos</div>
      </div>
    </div>

    <!-- Balance -->
    <div style="background:${balance>=0?'#e8f5ef':'#fdeef0'};border:1px solid ${balance>=0?'#b0ddc8':'#f5c0c8'};border-radius:12px;padding:14px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center">
      <div>
        <div style="font-size:9px;letter-spacing:2px;color:var(--mutedTx);font-weight:700;margin-bottom:4px">BALANCE DEL MES</div>
        <div style="font-size:11px;color:var(--mutedTx)">${balance>=0?'Pagaste más de lo que gastaste':'Gastaste más de lo que pagaste'}</div>
      </div>
      <div style="font-family:var(--mono);font-size:20px;font-weight:900;color:${balance>=0?'var(--greenDk)':'#e05c6e'}">${balance>=0?'+':''}${fmt(balance)}</div>
    </div>

    <!-- Gastos por categoría -->
    ${cats.length>0?`
    <div style="background:#fff;border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:12px">
      <div style="font-size:9px;letter-spacing:2px;color:var(--mutedTx);font-weight:700;margin-bottom:12px;text-transform:uppercase">Gastos por categoría</div>
      ${cats.map(([cat,monto])=>{
        const pctVal = totalGastos>0?(monto/totalGastos*100):0;
        const color = catColors[cat]||'#7a9a87';
        return `<div style="margin-bottom:10px">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
            <span style="font-size:12px;font-weight:600;color:var(--text)">${cat}</span>

          </div>
          <div style="height:5px;background:var(--muted);border-radius:99px;overflow:hidden">
            <div style="height:100%;width:${pctVal}%;background:${color};border-radius:99px;transition:width .5s"></div>
          </div>
          <div style="font-size:10px;color:var(--mutedTx);margin-top:2px">${pctVal.toFixed(1)}% del total</div>
        </div>`;
      }).join('')}
    </div>`:''}

    <!-- Movimientos del mes -->
    ${(data.gastos.length+data.pagos.length)>0?`
    <div style="background:#fff;border:1px solid var(--border);border-radius:12px;overflow:hidden">
      <div style="padding:12px 14px;border-bottom:1px solid var(--border)">
        <div style="font-size:9px;letter-spacing:2px;color:var(--mutedTx);font-weight:700;text-transform:uppercase">Todos los movimientos</div>
      </div>
      ${[...data.gastos,...data.pagos].sort((a,b)=>b.fecha?.localeCompare(a.fecha||'')||0).map(m=>`
        <div style="display:flex;justify-content:space-between;align-items:center;padding:11px 14px;border-bottom:1px solid var(--border)">
          <div style="flex:1;min-width:0">
            <div style="font-size:12px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${m.desc}</div>
            <div style="font-size:10px;color:var(--mutedTx);margin-top:1px">${m.fecha||''} · ${m.cat||'Otros'} · ${m.cardBank} ${m.cardName}</div>
          </div>
          <div style="font-family:var(--mono);font-size:13px;font-weight:800;color:${m.tipo==='gasto'?'#e05c6e':'var(--greenDk)'};margin-left:8px;white-space:nowrap">
            ${m.tipo==='gasto'?'−':'+'} ${fmt(m.monto)}
          </div>
        </div>
      `).join('')}
    </div>`
    :`<div style="text-align:center;padding:32px 16px;color:var(--mutedTx);font-size:13px">Sin movimientos en este período.<br/>Agrega gastos desde cada tarjeta.</div>`}
  </div>`;
}

function buildDashboard(){
  return`<div class="grid" id="cards-grid">${state.cards.map((c,i)=>buildTile(c,i)).join('')}</div>`;}

function buildTile(c,i){
  const uso=pct(c.deuda,c.linea),hc=heat(uso);
  return`<div class="tile" data-action="open-card" data-id="${c.id}" draggable="true" data-idx="${i||0}" style="cursor:grab">
    <div style="position:absolute;top:0;left:0;right:0;height:3px;background:${c.bankColor}"></div>
    <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-top:4px;margin-bottom:8px">
      <div><div style="font-size:8px;letter-spacing:2px;font-weight:800;color:${c.bankColor};margin-bottom:2px;text-transform:uppercase">${c.bank}</div><div style="font-size:14px;font-weight:800;color:var(--text)">${c.name}</div></div>
      <div style="font-size:10px;color:var(--mutedTx);background:var(--muted);border:1px solid var(--border);border-radius:5px;padding:2px 7px;font-family:var(--mono)">${c.tag}</div>
    </div>
    <div class="bar-track"><div class="bar-fill" style="width:${uso}%;background:${hc}"></div></div>
    <div style="display:flex;justify-content:space-between;margin-top:8px">
      <div><div style="font-size:8px;letter-spacing:1px;color:var(--mutedTx);font-weight:600;margin-bottom:2px;text-transform:uppercase">DEUDA</div><div style="font-family:var(--mono);font-size:13px;font-weight:800;color:#e05c6e">${fmt(c.deuda)}</div></div>
      <div style="text-align:right"><div style="font-size:8px;letter-spacing:1px;color:var(--mutedTx);font-weight:600;margin-bottom:2px;text-transform:uppercase">DISPONIBLE</div><div style="font-family:var(--mono);font-size:13px;font-weight:800;color:${hc}">${fmt(Math.max(0,c.linea-c.deuda))}</div></div>
    </div>
    ${(()=>{
      const hoy = new Date(); hoy.setHours(0,0,0,0);
      const diasPago = c.pago ? Math.ceil((new Date(c.pago)-hoy)/(1000*60*60*24)) : null;
      const alerta = diasPago !== null && diasPago <= 5 && diasPago >= 0;
      const vencida = diasPago !== null && diasPago < 0;
      return `<div style="display:flex;justify-content:space-between;align-items:center;margin-top:6px">
        <span style="font-size:11px;color:var(--sub)"><span style="color:${hc};font-weight:700">${uso.toFixed(1)}%</span> uso</span>
        ${c.pago?`<span style="font-size:11px;font-weight:700;color:${vencida?'#e05c6e':alerta?'#d4860a':'var(--mutedTx)'}">
          ${vencida?'⚠️ VENCIDA':alerta?`🔔 ${diasPago}d`:'pago'} <span style="color:${vencida?'#e05c6e':alerta?'#d4860a':'var(--amber)'}">${c.pago}</span>
        </span>`:''}
      </div>`;
    })()}
  </div>`;
}

function buildDetail(c){
  const{editMode,editData,addingMov,newMov}=state;
  const uso=pct(c.deuda,c.linea),hc=heat(uso),hb=heatBg(uso);
  const isDebitoCard = (c.tipo||'credito')==='debito';
  const chips = isDebitoCard ? [
    {label:'Saldo',val:fmt(Math.max(0,c.linea-c.deuda)),color:hc,bg:hb},
    {label:'Gastado',val:fmt(c.deuda),color:'#e05c6e',bg:'#fdeef0'},
    {label:'Total',val:fmt(c.linea),color:'',bg:''},
    {label:'Uso',val:`${uso.toFixed(1)}%`,color:hc,bg:hb},
    {label:'—',val:'—',color:'',bg:''},
    {label:'—',val:'—',color:'',bg:''},
  ] : [
    {label:'Deuda',val:fmt(c.deuda),color:'#e05c6e',bg:'#fdeef0'},
    {label:'Disponible',val:fmt(Math.max(0,c.linea-c.deuda)),color:hc,bg:hb},
    {label:'Uso',val:`${uso.toFixed(1)}%`,color:hc,bg:hb},
    {label:'Línea',val:fmt(c.linea),color:'',bg:''},
    {label:'Corte',val:c.corte||'—',color:'',bg:''},
    {label:'Pago',val:(()=>{
      if(!c.pago) return '—';
      const dias = Math.ceil((new Date(c.pago)-new Date())/(1000*60*60*24));
      if(dias<0) return '⚠️ VENCIDA';
      if(dias<=5) return `🔔 ${c.pago} (${dias}d)`;
      return c.pago;
    })(),color:(!c.pago)?'#d4860a':(Math.ceil((new Date(c.pago)-new Date())/(1000*60*60*24))<0)?'#e05c6e':(Math.ceil((new Date(c.pago)-new Date())/(1000*60*60*24))<=5)?'#d4860a':'#d4860a',bg:'#fff3e0'},
  ];

      <div style="display:flex;gap:8px">
        <button class="btn-outline sm" data-action="open-scan">📷</button>

      </div>
    </div>
    ${editMode?`<div class="edit-grid">${[
      {label:'Nombre',key:'name',type:'text'},{label:'Banco',key:'bank',type:'text'},
      {label:'Deuda (S/)',key:'deuda',type:'number'},{label:'Línea (S/)',key:'linea',type:'number'},
      {label:'Moneda',key:'moneda',type:'moneda'},{label:'F. Corte',key:'corte',type:'date'},{label:'F. Pago',key:'pago',type:'date'},{label:'Tipo de cuenta',key:'tipo',type:'select'},
    ].map(f=>{
    let input;
    if(f.type==='moneda'){
      input=`<select data-field="${f.key}" style="background:#fff;border:1px solid var(--border);border-radius:7px;color:var(--text);padding:9px 10px;font-size:13px;width:100%;font-family:inherit;-webkit-appearance:none"><option value="PEN" ${(editData[f.key]||'PEN')==='PEN'?'selected':''}>🇵🇪 Soles (S/)</option><option value="USD" ${(editData[f.key]||'')==='USD'?'selected':''}>🇺🇸 Dólares ($)</option></select>`;
    } else if(f.type==='select'){
      input=`<select data-field="${f.key}" style="background:#fff;border:1px solid var(--border);border-radius:7px;color:var(--text);padding:9px 10px;font-size:13px;width:100%;font-family:inherit;-webkit-appearance:none"><option value="credito" ${(editData[f.key]||'credito')==='credito'?'selected':''}>💳 Tarjeta de crédito</option><option value="debito" ${(editData[f.key]||'')==='debito'?'selected':''}>🏦 Cuenta débito/ahorro</option></select>`;
    } else {
      input=`<input type="${f.type}" value="${editData[f.key]||''}" data-field="${f.key}"/>`;
    }
    return `<div><div class="field-label">${f.label}</div>${input}</div>`;
  }).join('')}</div>`
    :`<div class="chips">${chips.map(ch=>`<div class="chip" style="background:${ch.bg||'var(--muted)'};border-color:${ch.bg?ch.color+'33':'var(--border)'}"><div class="chip-label">${ch.label}</div><div class="chip-val" style="color:${ch.color||'var(--text)'}">${ch.val}</div></div>`).join('')}</div>
    <div class="bar-track" style="height:6px;margin-bottom:12px"><div class="bar-fill" style="width:${uso}%;background:${hc}"></div></div>

      <!-- Acciones rapidas segun tipo de cuenta -->
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px">
        ${(()=>{
          const isDebito = (c.tipo||'credito')==='debito';
          if(isDebito){ return `
            <button data-action="quick-ingreso" style="background:#e8f5ef;border:1.5px solid var(--green);color:var(--greenDk);padding:12px 8px;border-radius:10px;cursor:pointer;font-size:12px;font-weight:700;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:4px">
              <span style="font-size:20px">💰</span>
              <span>Aumentar saldo</span>
              <span style="font-size:10px;font-weight:500;color:var(--mutedTx)">Suma a tu saldo</span>
            </button>
            <button data-action="quick-retiro" style="background:#fdeef0;border:1.5px solid #e05c6e;color:#e05c6e;padding:12px 8px;border-radius:10px;cursor:pointer;font-size:12px;font-weight:700;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:4px">
              <span style="font-size:20px">💸</span>
              <span>Retirar / Gastar</span>
              <span style="font-size:10px;font-weight:500;color:var(--mutedTx)">Baja tu saldo</span>
            </button>`; }
          else { return `
            <button data-action="quick-pago" style="background:#e8f5ef;border:1.5px solid var(--green);color:var(--greenDk);padding:12px 8px;border-radius:10px;cursor:pointer;font-size:12px;font-weight:700;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:4px">
              <span style="font-size:20px">💳</span>
              <span>Pagar deuda</span>
              <span style="font-size:10px;font-weight:500;color:var(--mutedTx)">Reduce tu deuda</span>
            </button>
            <button data-action="quick-linea" style="background:#e8f0fb;border:1.5px solid #3a7abf;color:#2a5a9f;padding:12px 8px;border-radius:10px;cursor:pointer;font-size:12px;font-weight:700;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:4px">
              <span style="font-size:20px">📈</span>
              <span>Aumentar linea</span>
              <span style="font-size:10px;font-weight:500;color:var(--mutedTx)">Sube tu limite</span>
            </button>`; }
        })()}
      </div>`}
    <div class="mov-hdr">
      <span class="mov-sect">Movimientos (${c.movimientos.length})</span>
      <button class="btn-outline sm ${addingMov?'gray':''}" data-action="toggle-mov">${addingMov?'✕ Cancelar':'+ Agregar'}</button>
    </div>
    ${addingMov?`<div class="mov-form">
      <div class="mov-row">
        <div style="flex:1"><div class="field-label">Tipo</div><select data-field="tipo"><option value="gasto" ${newMov.tipo==='gasto'?'selected':''}>Gasto</option><option value="pago" ${newMov.tipo==='pago'?'selected':''}>Pago/Abono</option></select></div>
        <div style="flex:1"><div class="field-label">Fecha</div><input type="date" value="${newMov.fecha}" data-field="fecha"/></div>

        <div style="flex:1"><div class="field-label">Monto</div><input type="number" placeholder="0.00" value="${newMov.monto}" data-field="monto"/></div>
      </div>
      <div class="mov-row" style="align-items:flex-end">

        <button class="btn-solid" data-action="add-mov" style="background:${newMov.tipo==='gasto'?'#e05c6e':'#6BBF9E'}">Registrar</button>
      </div>
      <label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;color:var(--sub)">
        <input type="checkbox" data-field="recurrente" ${newMov.recurrente?'checked':''} style="width:16px;height:16px;accent-color:var(--green)"/>

      </label>

    ${c.movimientos.length===0
      ?'<div class="empty">Sin movimientos — toca "+ Agregar" para comenzar</div>'
      :`<div class="mov-list">${c.movimientos.map(m=>`<div class="mov-item">
    <div style="flex:1;min-width:0"><div class="mov-desc">${m.desc}</div><div class="mov-meta">${m.fecha} · ${m.cat}</div></div>
    <div style="display:flex;align-items:center;gap:8px">

      <button data-action="del-mov" data-movid="${m.id}" style="background:none;border:none;color:#ccc;cursor:pointer;font-size:15px;padding:2px 4px">🗑</button>
    </div>
  </div>`).join('')}</div>`}
  </div>`;
}

        :`<div style="font-size:32px;margin-bottom:8px">📷</div><div style="font-size:13px;color:var(--sub);font-weight:600">Toca para subir imagen</div><div style="font-size:11px;color:var(--mutedTx);margin-top:4px">Galería · Archivos · Foto de WhatsApp guardada</div>`}
        <input type="file" id="scan-file" accept="image/*" style="display:none"/>
      </div>
      ${sc.imgB64&&!sc.result?`<button class="btn-solid" id="scan-btn" style="background:${sc.scanning?'var(--muted)':'#6BBF9E'};color:${sc.scanning?'var(--mutedTx)':'#fff'};width:100%;padding:13px;font-size:14px" ${sc.scanning?'disabled':''}>${sc.scanning?'<span class="spin">◌</span> Analizando…':'⚡ Escanear imagen'}</button>`:''}
      ${sc.error?`<div class="scan-err">${sc.error}</div>`:''}
      ${sc.result?buildScanResultHTML(sc.result):''}
      <button class="btn-outline gray" id="close-scan-btn" style="width:100%">Cerrar</button>
    </div>
  </div>`;
}

// ── EVENTS ──────────────────────────────────────────────────────────────
// Listeners persistentes — se agregan una sola vez al inicio
let _eventsInit = false;
function bindEvents(){
  if(_eventsInit) return;
  _eventsInit = true;

  // CLICKS
  document.addEventListener('click', function(e){
    const el = e.target.closest('[data-action]');
    if(el){
      const a = el.dataset.action, id = el.dataset.id;
      if(a==='goto-dashboard'){state.view='dashboard';state.selId=null;state.editMode=false;state.addingMov=false;render();}
    else if(a==='goto-resumen'){state.view='resumen';state.selId=null;state.editMode=false;state.addingMov=false;render();}
      else if(a==='open-card'){state.selId=id;state.view='card';state.editMode=false;state.addingMov=false;render();}
      else if(a==='open-scan'){state.showScan=true;state.scan={...state.scan,result:null,error:null,preview:null,imgB64:null,scanMode:state.scan.scanMode||'estado'};render();}
      else if(a==='start-edit'){const c=state.cards.find(x=>x.id===state.selId);state.editData={name:c.name,bank:c.bank,deuda:String(c.deuda||''),linea:String(c.linea||''),corte:c.corte,pago:c.pago,tipo:c.tipo||'credito',moneda:c.moneda||'PEN'};state.editMode=true;render();}
      else if(a==='save-edit'){saveEdit();}
      else if(a==='toggle-mov'){state.addingMov=!state.addingMov;state.newMov={fecha:today(),desc:'',monto:'',cat:'Otros',tipo:'gasto',recurrente:false};render();}
      else if(a==='add-mov'){addMov();}
    else if(a==='quick-pago'){state.quickModal={type:'pago',monto:'',desc:'Pago de tarjeta'};render();}
    else if(a==='quick-ingreso'){state.quickModal={type:'ingreso',monto:'',desc:'Ingreso de saldo'};render();}
    else if(a==='quick-retiro'){state.quickModal={type:'retiro',monto:'',desc:'Retiro/Gasto'};render();}
    else if(a==='quick-linea'){state.quickModal={type:'linea',monto:'',desc:''};render();}
    else if(a==='apply-quick'){applyQuick();}
    else if(a==='close-quick'){state.quickModal=null;render();}
    else if(a==='exportar-csv'){exportarCSV();}
    else if(a==='del-mov'){
      const movId = Number(el.dataset.movid);
      const card = state.cards.find(x=>x.id===state.selId);
      const mov = card?.movimientos.find(m=>m.id===movId);
      if(!mov) return;
      // Revert the deuda change
      state.cards = state.cards.map(c=>{
        if(c.id!==state.selId) return c;
        const newDeuda = mov.tipo==='gasto' ? Math.max(0,c.deuda-mov.monto) : c.deuda+mov.monto;
        return {...c, deuda:newDeuda, movimientos:c.movimientos.filter(m=>m.id!==movId)};
      });
      scheduleSave(state.cards);
      showToast('🗑 Movimiento eliminado');
      render();
    }
      return;
    }
    if(e.target.closest('#close-scan-btn')){state.showScan=false;render();return;}
    const ov=e.target.closest('#scan-overlay');if(ov&&e.target===ov){state.showScan=false;render();return;}
    if(e.target.closest('#upload-zone')){document.getElementById('scan-file')?.click();return;}
    if(e.target.closest('#scan-btn')){runScan();return;}
    if(e.target.closest('#apply-scan-btn')){applyScan();return;}
  });

  // INPUT — actualiza state en tiempo real sin re-render (para no perder foco)
  document.addEventListener('input', function(e){
    const field = e.target.dataset.field;
    if(!field) return;
    if(state.editMode) state.editData[field] = e.target.value;
    if(state.addingMov) state.newMov[field] = e.target.value;
    if(state.quickModal){
      if(field==='quick-monto'){ state.quickModal.monto = e.target.value; render(); }
      if(field==='quick-desc')  state.quickModal.desc  = e.target.value;
    }
  });

  // CHANGE — para selects y file input
  document.addEventListener('change', function(e){
    const field = e.target.dataset.field;
    if(field){
      if(state.editMode){ state.editData[field] = e.target.value; }
      if(state.addingMov){ state.newMov[field] = e.target.value; render(); }
      return;
    }
    if(e.target.id==='scan-target'){ state.scan.targetId=e.target.value; return; }
    if(e.target.id==='scan-file'){
      const file=e.target.files[0]; if(!file) return;
      state.scan.imgType=file.type||'image/jpeg';
      const r=new FileReader();
      r.onload=ev=>{const f=ev.target.result;state.scan.preview=f;state.scan.imgB64=f.split(',')[1];state.scan.result=null;state.scan.error=null;render();};
      r.readAsDataURL(file); return;
    }
  });
}
function saveEdit(){
  const d=state.editData;
  state.cards=state.cards.map(c=>c.id===state.selId?{...c,name:d.name||c.name,bank:d.bank||c.bank,deuda:parseFloat(d.deuda)||0,linea:parseFloat(d.linea)||0,corte:d.corte,pago:d.pago,tipo:d.tipo||'credito',moneda:d.moneda||'PEN'}:c);

function preprocessImage(b64, imgType){
  return new Promise(resolve=>{
    const img=new Image();
    img.onload=()=>{
      const canvas=document.createElement('canvas');
      canvas.width=img.width; canvas.height=img.height;
      const ctx=canvas.getContext('2d');
      ctx.drawImage(img,0,0);
      // Detectar si fondo es oscuro (sample centro)
      const px=ctx.getImageData(img.width/2,img.height/2,1,1).data;
      const brightness=(px[0]+px[1]+px[2])/3;
      if(brightness<100){
        // Invertir colores para OCR
        ctx.globalCompositeOperation='difference';
        ctx.fillStyle='white';
        ctx.fillRect(0,0,canvas.width,canvas.height);
      }
      // Escala de grises + contraste
      const imageData=ctx.getImageData(0,0,canvas.width,canvas.height);
      const d=imageData.data;
      for(let i=0;i<d.length;i+=4){
        const gray=0.299*d[i]+0.587*d[i+1]+0.114*d[i+2];
        const contrast=Math.min(255,Math.max(0,(gray-128)*1.5+128));
        d[i]=d[i+1]=d[i+2]=contrast;
      }
      ctx.putImageData(imageData,0,0);
      resolve(canvas.toDataURL('image/png'));
    };
    img.src='data:'+imgType+';base64,'+b64;
  });
}

async function runScan(){
  if(!state.scan.imgB64)return;
  state.scan.scanning=true;state.scan.error=null;render();
  try{
    // Pre-procesar imagen: invertir si fondo oscuro para mejorar OCR
    const imgSrc = await preprocessImage(state.scan.imgB64, state.scan.imgType);
    const worker=await Tesseract.createWorker('spa+eng');
    await worker.setParameters({
      tessedit_pageseg_mode: '6', // Bloque uniforme de texto
      preserve_interword_spaces: '1',
    });
    const {data:{text}}=await worker.recognize(imgSrc);
    await worker.terminate();

    const lines=text.split('\n').map(l=>l.trim()).filter(Boolean);
    const joined=lines.join(' ');
    const todayStr=()=>new Date().toISOString().slice(0,10);

    const findMonto=str=>{
      // Patrones: S/19.90, S/ 19.90, 19.90, 19,90
      const ms=str.match(/S\/\s*([\d]+[.,][\d]{2})/g)
              ||str.match(/([\d]{1,6}[.,][\d]{2})/g)||[];
      return ms.map(m=>parseFloat(m.replace(/[^\d.]/g,'').replace(',','.'))).filter(n=>n>0.5);
    };
    const findDate=str=>{
      // "24 junio 2026", "24/06/2026", "24-06-2026"
      const meses={enero:'01',febrero:'02',marzo:'03',abril:'04',mayo:'05',junio:'06',
                   julio:'07',agosto:'08',septiembre:'09',octubre:'10',noviembre:'11',diciembre:'12'};
      const m1=str.match(/(\d{1,2})\s+(enero|febrero|marzo|abril|mayo|junio|julio|agosto|septiembre|octubre|noviembre|diciembre)\s+(\d{4})/i);
      if(m1)return m1[3]+'-'+meses[m1[2].toLowerCase()]+'-'+m1[1].padStart(2,'0');
      const m2=str.match(/(\d{2})[\/-](\d{2})[\/-](\d{2,4})/);
      if(m2){const y=m2[3].length===2?'20'+m2[3]:m2[3];return y+'-'+m2[2]+'-'+m2[1];}
      return null;
    };
    const findBank=str=>{
      const u=str.toUpperCase();
      if(u.includes('INTERBANK'))return 'INTERBANK';
      if(u.includes('BBVA'))return 'BBVA';
      if(u.includes('FALABELLA')||u.includes('CMR'))return 'FALABELLA';
      if(u.includes('BCP')||u.includes('CREDITO'))return 'BCP';
      if(u.includes('SCOTIABANK'))return 'SCOTIABANK';
      return null;
    };
    const inferCat=str=>{
      const u=str.toUpperCase();
      if(/RESTAUR|BURGER|KFC|PIZZA|MCDONALD|POLLO|CHIFA|CAFE|BEMBOS|NORKY|LITTLE CAESAR|CAESAR|PIZZA/.test(u))return 'Alimentación';
      if(/UBER|TAXI|METRO|BUS|GASOLINA|PETROPER|REPSOL|GRIFOS/.test(u))return 'Transporte';
      if(/CINE|NETFLIX|SPOTIFY|STEAM|PLAY|XBOX/.test(u))return 'Entretenimiento';
      if(/FARMACIA|BOTICA|CLINICA|HOSPITAL|MEDIC|INKAFARMA/.test(u))return 'Salud';
      if(/SAGA|RIPLEY|OECHSLE|ZARA|ROPA|MODA/.test(u))return 'Ropa';
      if(/LUZ DEL SUR|SEDAPAL|ENTEL|MOVISTAR|CLARO|BITEL|INTERNET/.test(u))return 'Servicios';
      if(/HOTEL|AEROPUERTO|LATAM|AVIANCA|VUELO/.test(u))return 'Viajes';
      return 'Otros';
    };

    const montos=findMonto(joined);
    const fecha=findDate(joined)||todayStr();
    const bank=findBank(joined);

    // Buscar descripción — primera línea larga que no sea número ni fecha
    const desc=lines.find(l=>
      l.length>4 &&
      !/^[\d\/.,: ]+$/.test(l) &&
      !/^S\//.test(l) &&
      !/^(pendiente|aprobado|fecha|número|tarjeta|detalle|movimiento|trasladar|compartir)/i.test(l)
    )||'Gasto escaneado';

    if(state.scan.scanMode==='boleta'){
      const monto=montos.length>0?Math.max(...montos):0;
      state.scan.result={bank:null,name:null,deuda:null,linea:null,corte:null,pago:null,
        movimientos:monto>0?[{fecha,desc,monto,tipo:'gasto',cat:inferCat(joined)}]:[]};
    }else{
      const deudaM=joined.match(/(?:SALDO|TOTAL A PAGAR|PAGAR|DEUDA)[^\d]*([\d.,]+)/i);
      const deuda=deudaM?parseFloat(deudaM[1].replace(/,/g,'')):(montos.length>0?Math.max(...montos):null);
      const lineaM=joined.match(/(?:L[IÍ]NEA|LIMITE|CR[ÉE]DITO)[^\d]*([\d.,]+)/i);
      const linea=lineaM?parseFloat(lineaM[1].replace(/,/g,'')):null;
      const movimientos=[];
      lines.forEach(line=>{
        const ms=findMonto(line);
        if(ms.length>0&&line.length>5&&!/TOTAL|SALDO|LINEA|LIMITE/i.test(line)){
          const d=findDate(line)||fecha;
          const monto=ms[0];
          const desc2=line.replace(/S\/[\d.,]+/g,'').replace(/[\d\/.-]{6,}/g,'').trim()||'Movimiento';
          if(monto>0&&monto<50000)movimientos.push({fecha:d,desc:desc2,monto,tipo:'gasto',cat:inferCat(desc2)});
        }
      });
      state.scan.result={bank,name:bank?bank+' Tarjeta':null,deuda,linea,corte:null,pago:null,movimientos:movimientos.slice(0,20)};
    }
  }catch(err){state.scan.error='No se pudo leer la imagen. Intenta con una foto más clara o mejor iluminación.';}
  state.scan.scanning=false;render();
}
function applyScan(){
  const r=state.scan.result;if(!r)return;
  const tid=state.scan.targetId||state.cards[0].id;
  // Si no hay movimientos detectados, leer campos manuales
  let newMovs=(r.movimientos||[]).map(m=>({
    id: Date.now()+Math.random(),
    fecha: m.fecha||today(),
    desc: m.desc||'Sin descripción',
    monto: parseFloat(m.monto)||0,
    tipo: m.tipo==='pago'?'pago':'gasto',
    cat: m.cat||'Otros',
  })).filter(m=>m.monto>0);
  if(newMovs.length===0){
    const descEl=document.getElementById('manual-desc');
    const montoEl=document.getElementById('manual-monto');
    const tipoEl=document.getElementById('manual-tipo');
    const catEl=document.getElementById('manual-cat');
    const monto=parseFloat(montoEl?.value||0);
    if(monto>0){
      newMovs=[{
        id:Date.now()+Math.random(),
        fecha:today(),
        desc:descEl?.value||'Gasto escaneado',
        monto,
        tipo:tipoEl?.value||'gasto',
        cat:catEl?.value||'Otros',
      }];
    }
  }

  state.cards=state.cards.map(c=>{
    if(c.id!==tid)return c;
    // Merge movements — avoid duplicates by checking desc+fecha+monto
    const existing = c.movimientos||[];
    const existingKeys = new Set(existing.map(m=>`${m.fecha}|${m.desc}|${m.monto}`));
    const uniqueNew = newMovs.filter(m=>!existingKeys.has(`${m.fecha}|${m.desc}|${m.monto}`));
    const merged = [...uniqueNew, ...existing];
    return{
      ...c,
      bank: r.bank||c.bank,
      name: r.name||c.name,
      deuda: r.deuda!=null?parseFloat(r.deuda)||0:c.deuda,
      linea: r.linea!=null?parseFloat(r.linea)||0:c.linea,
      corte: r.corte||c.corte,
      pago: r.pago||c.pago,
      movimientos: merged,
    };
  });
  state.showScan=false;
  const count = newMovs.length;
  scheduleSave(state.cards);
  showToast(count>0?`✓ Datos y ${count} movimiento${count!==1?'s':''} aplicados`:'✓ Datos aplicados a la tarjeta');
  render();
}

let clockInterval=null;

// ── DRAG & DROP para reordenar tarjetas ─────────────────────────────────
function initDragDrop(){
  const grid = document.getElementById('cards-grid');
  if(!grid || grid._dragInit) return;
  grid._dragInit = true;
  let dragIdx = null;

  grid.addEventListener('dragstart', e=>{
    const tile = e.target.closest('.tile');
    if(!tile) return;
    dragIdx = parseInt(tile.dataset.idx);
    tile.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
  });

  grid.addEventListener('dragend', e=>{
    document.querySelectorAll('.tile').forEach(t=>{
      t.classList.remove('dragging','drag-over');
    });
    dragIdx = null;
  });

  grid.addEventListener('dragover', e=>{
    e.preventDefault();
    const tile = e.target.closest('.tile');
    if(!tile) return;
    document.querySelectorAll('.tile').forEach(t=>t.classList.remove('drag-over'));
    tile.classList.add('drag-over');
  });

  grid.addEventListener('drop', e=>{
    e.preventDefault();
    const tile = e.target.closest('.tile');
    if(!tile || dragIdx === null) return;
    const dropIdx = parseInt(tile.dataset.idx);
    if(dragIdx === dropIdx) return;
    // Reordenar
    const cards = [...state.cards];
    const [moved] = cards.splice(dragIdx, 1);
    cards.splice(dropIdx, 0, moved);
    state.cards = cards;
    scheduleSave(state.cards);
    render();
  });

  // Touch support
  let touchDragIdx = null, touchClone = null;
  grid.addEventListener('touchstart', e=>{
    const tile = e.target.closest('.tile');
    if(!tile) return;
    touchDragIdx = parseInt(tile.dataset.idx);
    tile.classList.add('dragging');
    // Crear clon visual
    touchClone = tile.cloneNode(true);
    touchClone.style.cssText = 'position:fixed;opacity:0.8;pointer-events:none;z-index:9999;width:'+tile.offsetWidth+'px;transform:scale(1.05);transition:none';
    document.body.appendChild(touchClone);
  }, {passive:true});

  grid.addEventListener('touchmove', e=>{
    if(touchDragIdx===null||!touchClone) return;
    const t = e.touches[0];
    touchClone.style.left = (t.clientX - touchClone.offsetWidth/2) + 'px';
    touchClone.style.top = (t.clientY - touchClone.offsetHeight/2) + 'px';
    // Highlight target
    document.querySelectorAll('.tile').forEach(tile=>{
      const r = tile.getBoundingClientRect();
      if(t.clientX>=r.left&&t.clientX<=r.right&&t.clientY>=r.top&&t.clientY<=r.bottom){
        document.querySelectorAll('.tile').forEach(t2=>t2.classList.remove('drag-over'));
        tile.classList.add('drag-over');
      }
    });
  }, {passive:true});

  grid.addEventListener('touchend', e=>{
    if(touchDragIdx===null) return;
    if(touchClone){touchClone.remove();touchClone=null;}
    document.querySelectorAll('.tile').forEach(t=>t.classList.remove('dragging','drag-over'));
    const t = e.changedTouches[0];
    let dropIdx = null;
    document.querySelectorAll('.tile').forEach(tile=>{
      const r = tile.getBoundingClientRect();
      if(t.clientX>=r.left&&t.clientX<=r.right&&t.clientY>=r.top&&t.clientY<=r.bottom){
        dropIdx = parseInt(tile.dataset.idx);
      }
    });
    if(dropIdx!==null && dropIdx!==touchDragIdx){
      const cards=[...state.cards];
      const [moved]=cards.splice(touchDragIdx,1);
      cards.splice(dropIdx,0,moved);
      state.cards=cards;
      scheduleSave(state.cards);
      render();
    }
    touchDragIdx=null;
  }, {passive:true});
}

function startClock(){
  if(clockInterval)clearInterval(clockInterval);
  const el=document.getElementById('clock');if(!el)return;
  const tick=()=>{if(el)el.textContent=new Date().toTimeString().slice(0,8);};
  tick();clockInterval=setInterval(tick,1000);
}

render();
</script>
